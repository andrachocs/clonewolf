<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANDRA FLASHER - Pembuat Nota Digital</title>
    <!-- Library html2canvas untuk mengubah tampilan nota menjadi Gambar PNG -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
        body { background-color: #f0f4f8; padding: 15px; color: #333; }
        .container { max-width: 520px; margin: 0 auto; background: #fff; padding: 22px; border-radius: 14px; box-shadow: 0 6px 20px rgba(0,0,0,0.08); }
        h2 { text-align: center; color: #1F4E78; margin-bottom: 4px; font-size: 22px; }
        p.subtitle { text-align: center; color: #666; font-size: 13px; margin-bottom: 22px; }
        
        .form-group { margin-bottom: 14px; }
        label { display: block; font-weight: 600; font-size: 13px; margin-bottom: 5px; color: #1F4E78; }
        input, select, textarea { width: 100%; padding: 11px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; background: #fafafa; transition: all 0.2s; }
        input:focus, select:focus { border-color: #1F4E78; background: #fff; outline: none; box-shadow: 0 0 0 3px rgba(31, 78, 120, 0.1); }
        .row { display: flex; gap: 12px; }
        .row .form-group { flex: 1; }
        
        .btn-group { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
        button { width: 100%; padding: 13px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 14px; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-img { background-color: #d97706; color: white; }
        .btn-wa { background-color: #16a34a; color: white; }
        .btn-print { background-color: #1F4E78; color: white; }
        button:hover { opacity: 0.92; transform: translateY(-1px); }

        /* Area Tampilan Struk / Nota Visual Desain Premium */
        #notaContainer { margin-top: 25px; padding: 15px; background: #e2e8f0; border-radius: 10px; display: flex; justify-content: center; }
        #notaPreview { 
            background: #ffffff; 
            width: 100%;
            max-width: 420px;
            padding: 24px; 
            border-radius: 10px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            border-top: 6px solid #1F4E78;
            color: #1e293b;
        }
        .nota-header { text-align: center; border-bottom: 2px dashed #cbd5e1; padding-bottom: 14px; margin-bottom: 14px; }
        .nota-header h3 { color: #1F4E78; font-size: 22px; font-weight: 800; margin-bottom: 2px; letter-spacing: 0.5px; }
        .nota-header p { font-size: 12px; color: #64748b; font-weight: 500; }
        
        .nota-meta { display: flex; justify-content: space-between; font-size: 12px; color: #475569; margin-bottom: 14px; background: #f8fafc; padding: 8px 10px; border-radius: 6px; border: 1px solid #f1f5f9; }
        
        .nota-table { width: 100%; border-collapse: collapse; font-size: 13px; margin-bottom: 14px; }
        .nota-table td { padding: 6px 0; vertical-align: top; }
        .nota-table td.label-col { color: #64748b; width: 38%; font-weight: 500; }
        .nota-table td.val-col { text-align: right; font-weight: 700; color: #0f172a; width: 62%; }

        .status-badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; text-transform: uppercase; }
        .status-lunas { background-color: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
        .status-belum { background-color: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }

        .total-box { border-top: 2px dashed #cbd5e1; padding-top: 12px; margin-top: 4px; display: flex; justify-content: space-between; align-items: center; font-size: 15px; font-weight: bold; color: #1F4E78; background: #f8fafc; padding: 10px 12px; border-radius: 6px; }
        .total-box span:last-child { font-size: 18px; font-weight: 800; color: #0f172a; }

        .footer-note { text-align: center; font-size: 11px; color: #64748b; margin-top: 18px; border-top: 1px solid #f1f5f9; padding-top: 12px; line-height: 1.4; }

        @media print {
            body * { visibility: hidden; }
            #notaPreview, #notaPreview * { visibility: visible; }
            #notaPreview { position: absolute; left: 0; top: 0; width: 100%; border: none; box-shadow: none; border-top: 6px solid #1F4E78; }
        }
    </style>
</head>
<body>

<div class="container">
    <h2>ANDRA FLASHER</h2>
    <p class="subtitle">Generator Nota Digital & Struk Konter</p>

    <form id="notaForm">
        <div class="row">
            <div class="form-group">
                <label>No. Nota</label>
                <input type="text" id="noNota" readonly>
            </div>
            <div class="form-group">
                <label>Tanggal</label>
                <input type="date" id="tglNota">
            </div>
        </div>

        <div class="row">
            <div class="form-group">
                <label>Nama Pelanggan</label>
                <input type="text" id="namaPelanggan" placeholder="Contoh: Pak Mustofa" oninput="updatePreview()" required>
            </div>
            <div class="form-group">
                <label>No. WhatsApp</label>
                <input type="text" id="noWA" placeholder="08xxxxxxxxxx">
            </div>
        </div>

        <div class="form-group">
            <label>Tipe HP / Barang</label>
            <input type="text" id="tipeHP" placeholder="Contoh: Redmi Note 10S" oninput="updatePreview()" required>
        </div>

        <div class="form-group">
            <label>Kerusakan</label>
            <input type="text" id="kerusakan" placeholder="Contoh: HP Panas, Dicas Tidak Nambah" oninput="updatePreview()" required>
        </div>

        <div class="form-group">
            <label>Tindakan Perbaikan</label>
            <input type="text" id="perbaikan" placeholder="Contoh: Perbaiki Socket Sub Board" oninput="updatePreview()" required>
        </div>

        <div class="row">
            <div class="form-group">
                <label>Biaya Servis (Rp)</label>
                <input type="number" id="biaya" placeholder="70000" oninput="updatePreview()" required>
            </div>
            <div class="form-group">
                <label>Status Bayar</label>
                <select id="statusBayar" onchange="updatePreview()">
                    <option value="LUNAS">LUNAS</option>
                    <option value="BELUM LUNAS">BELUM LUNAS</option>
                </select>
            </div>
        </div>

        <div class="form-group">
            <label>Garansi</label>
            <select id="garansi" onchange="updatePreview()">
                <option value="3 Hari">3 Hari</option>
                <option value="1 Minggu">1 Minggu</option>
                <option value="1 Bulan">1 Bulan</option>
                <option value="Tanpa Garansi">Tanpa Garansi</option>
            </select>
        </div>

        <div class="btn-group">
            <button type="button" class="btn-img" onclick="downloadGambarStruk()">📸 Download Gambar Struk (.PNG)</button>
            <button type="button" class="btn-wa" onclick="kirimWA()">📲 Kirim Nota Teks WA</button>
            <button type="button" class="btn-print" onclick="cetakNota()">🖨️ Cetak / PDF</button>
        </div>
    </form>

    <!-- Area Struk Visual Desain Premium -->
    <div id="notaContainer">
        <div id="notaPreview">
            <div class="nota-header">
                <h3>ANDRA FLASHER</h3>
                <p>Spesialis Servis HP & Sparepart</p>
            </div>

            <div class="nota-meta">
                <span>No: <strong id="pNoNota">-</strong></span>
                <span>Tgl: <strong id="pTgl">-</strong></span>
            </div>

            <table class="nota-table">
                <tr><td class="label-col">Pelanggan</td><td class="val-col" id="pNama">-</td></tr>
                <tr><td class="label-col">Tipe HP</td><td class="val-col" id="pTipe">-</td></tr>
                <tr><td class="label-col">Kerusakan</td><td class="val-col" id="pKerusakan">-</td></tr>
                <tr><td class="label-col">Perbaikan</td><td class="val-col" id="pPerbaikan">-</td></tr>
                <tr>
                    <td class="label-col">Status</td>
                    <td class="val-col"><span id="pStatus" class="status-badge status-lunas">LUNAS</span></td>
                </tr>
                <tr><td class="label-col">Garansi</td><td class="val-col" id="pGaransi">-</td></tr>
            </table>

            <div class="total-box">
                <span>TOTAL BIAYA:</span>
                <span id="pTotal">Rp 0</span>
            </div>

            <div class="footer-note">
                <p>Terima kasih atas kepercayaan Anda!</p>
                <p><strong>ANDRA FLASHER</strong> — Nota Resmi Servis</p>
            </div>
        </div>
    </div>
</div>

<script>
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('tglNota').value = today;
    document.getElementById('noNota').value = 'AF-' + Date.now().toString().slice(-6);

    function updatePreview() {
        document.getElementById('pNoNota').innerText = document.getElementById('noNota').value;
        document.getElementById('pTgl').innerText = document.getElementById('tglNota').value;
        document.getElementById('pNama').innerText = document.getElementById('namaPelanggan').value || '-';
        document.getElementById('pTipe').innerText = document.getElementById('tipeHP').value || '-';
        document.getElementById('pKerusakan').innerText = document.getElementById('kerusakan').value || '-';
        document.getElementById('pPerbaikan').innerText = document.getElementById('perbaikan').value || '-';
        
        const status = document.getElementById('statusBayar').value;
        const pStatusEl = document.getElementById('pStatus');
        pStatusEl.innerText = status;
        if (status === 'LUNAS') {
            pStatusEl.className = 'status-badge status-lunas';
        } else {
            pStatusEl.className = 'status-badge status-belum';
        }

        document.getElementById('pGaransi').innerText = document.getElementById('garansi').value;
        
        const biaya = parseFloat(document.getElementById('biaya').value) || 0;
        document.getElementById('pTotal').innerText = 'Rp ' + biaya.toLocaleString('id-ID');
    }

    updatePreview();

    function downloadGambarStruk() {
        const nama = document.getElementById('namaPelanggan').value || 'Pelanggan';
        const noNota = document.getElementById('noNota').value;
        const element = document.getElementById('notaPreview');

        html2canvas(element, { scale: 2 }).then(canvas => {
            const link = document.createElement('a');
            link.download = `Nota_${noNota}_${nama.replace(/\s+/g, '_')}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
        });
    }

    function kirimWA() {
        const nama = document.getElementById('namaPelanggan').value;
        let noWA = document.getElementById('noWA').value.trim();
        const tipe = document.getElementById('tipeHP').value;
        const kerusakan = document.getElementById('kerusakan').value;
        const perbaikan = document.getElementById('perbaikan').value;
        const biaya = parseFloat(document.getElementById('biaya').value) || 0;
        const status = document.getElementById('statusBayar').value;
        const garansi = document.getElementById('garansi').value;
        const noNota = document.getElementById('noNota').value;

        if(!nama || !tipe || !biaya) {
            alert('Mohon isi Nama, Tipe HP, dan Biaya terlebih dahulu!');
            return;
        }

        if(noWA.startsWith('0')) {
            noWA = '62' + noWA.slice(1);
        }

        const pesan = 
`============================
        *ANDRA FLASHER*        
   *Nota Servis Resmi Digital*  
============================
*No. Nota:* ${noNota}
*Tanggal:* ${document.getElementById('tglNota').value}
*Pelanggan:* ${nama}
--------------------------------------------
*Tipe HP:* ${tipe}
*Kerusakan:* ${kerusakan}
*Tindakan:* ${perbaikan}
--------------------------------------------
*Total Biaya:* Rp ${biaya.toLocaleString('id-ID')}
*Status:* *${status}*
*Garansi:* ${garansi}
============================
_Terima kasih telah servis di ANDRA FLASHER!_`;

        const url = noWA 
            ? `https://api.whatsapp.com/send?phone=${noWA}&text=${encodeURIComponent(pesan)}`
            : `https://api.whatsapp.com/send?text=${encodeURIComponent(pesan)}`;
            
        window.open(url, '_blank');
    }

    function cetakNota() {
        updatePreview();
        window.print();
    }
</script>

</body>
</html>
